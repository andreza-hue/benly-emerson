<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor de peças | Campanha Emerson - Benly Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0E3534;--teal:#17695F;--mint:#41F6CB;--coral:#FF7E59;--cream:#F7EFE4;--muted:#56706C}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:Poppins,sans-serif;color:var(--ink);background:var(--cream);display:flex;flex-direction:column}
.hdr{height:60px;flex:0 0 60px;display:flex;align-items:center;gap:14px;padding:0 18px;background:#fff8ee;box-shadow:0 6px 20px -16px rgba(14,53,52,.4);z-index:5}
.hdr .lg{height:auto}.hdr .lg-benly{width:100px}.hdr .lg-emerson{width:94px}.hdr .x{font-weight:600;color:var(--teal)}
.hdr h1{font-size:15px;margin:0 0 0 auto;font-weight:600;color:var(--muted)}
.app{flex:1;display:grid;grid-template-columns:260px 1fr 380px;min-height:0}
nav{overflow:auto;background:#fffaf3;border-right:1px solid rgba(14,53,52,.08);padding:12px}
nav h3{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--teal);margin:16px 8px 6px}
nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;font:500 13px Poppins;color:var(--ink);padding:7px 8px;border-radius:10px;cursor:pointer}
nav button img{width:34px;height:34px;object-fit:cover;border-radius:6px;flex:0 0 34px;background:#eee}
nav button.on{background:rgba(23,105,95,.1);color:var(--teal);font-weight:600}
nav button .tg{margin-left:auto;font-size:10px;font-weight:600;color:var(--coral)}
.stage{display:flex;align-items:center;justify-content:center;padding:24px;min-width:0;min-height:0;position:relative}
.stage canvas{max-width:100%;max-height:calc(100vh - 160px);box-shadow:0 30px 60px -30px rgba(14,53,52,.45);border-radius:8px;background:#fff}
.scenes{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px}
.scenes button{border:0;border-radius:999px;padding:6px 12px;font:600 12px Poppins;background:#fff;color:var(--ink);cursor:pointer;box-shadow:0 4px 12px -8px rgba(0,0,0,.4)}
.scenes button.on{background:var(--teal);color:#fff}
aside{overflow:auto;background:#fff;border-left:1px solid rgba(14,53,52,.08);padding:18px}
aside h2{font-size:18px;margin:0 0 2px}aside .code{font-size:11px;font-weight:700;color:var(--teal);letter-spacing:.4px}
.fld{margin-top:12px}.fld label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:4px}
.fld textarea{width:100%;border:1px solid rgba(14,53,52,.15);border-radius:10px;padding:9px 11px;font:14px/1.45 Poppins;color:var(--ink);resize:vertical;min-height:42px}
.fld textarea:focus{outline:2px solid var(--mint);border-color:transparent}
.sc-h{margin-top:18px;font-size:12px;font-weight:700;color:var(--coral);text-transform:uppercase;letter-spacing:.4px}
.acts{position:sticky;bottom:-18px;background:#fff;padding:14px 0 18px;margin-top:16px;display:flex;flex-wrap:wrap;gap:8px;border-top:1px solid rgba(14,53,52,.08)}
.btn{border:0;border-radius:999px;padding:11px 16px;font:600 13px Poppins;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn.p{background:linear-gradient(135deg,#FF9473,#FF7E59);color:#fff;box-shadow:0 10px 22px -12px rgba(255,126,89,.7)}
.btn.s{background:rgba(23,105,95,.1);color:var(--teal)}
.btn:disabled{opacity:.5;cursor:default}
.prog{width:100%;height:6px;border-radius:99px;background:rgba(14,53,52,.1);overflow:hidden;display:none}.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#41F6CB,#FF7E59)}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:10px}
@media (max-width:1000px){.app{grid-template-columns:1fr}nav{max-height:180px}aside{border-left:0}.stage canvas{max-height:60vh}}
</style></head><body>

  const types=['video/mp4;codecs=avc1.42E01E','video/mp4','video/webm;codecs=vp9','video/webm'];const mt=types.find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||'video/webm';
  const st=cv.captureStream(30);const mr=new MediaRecorder(st,{mimeType:mt,videoBitsPerSecond:8e6});const ch=[];mr.ondataavailable=e=>e.data.size&&ch.push(e.data);
  const total=cur.frames.reduce((a,f)=>a+f.dur,0);const t0=performance.now();mr.start(200);
  await new Promise(res=>{function step(){const t=(performance.now()-t0)/1000;if(t>=total){res();return}
    let acc=0,si=0;for(;si<cur.frames.length;si++){if(t<acc+cur.frames[si].dur)break;acc+=cur.frames[si].dur}si=Math.min(si,cur.frames.length-1);const lt=t-acc,fr=cur.frames[si];
    ctx.clearRect(0,0,cv.width,cv.height);drawFrame(fr,si,{im:ims[si],t:lt,zoom:1+0.05*(lt/fr.dur)});
    if(si>0&&lt<0.35){const pf=cur.frames[si-1];drawFrame(pf,si-1,{im:ims[si-1],t:99,zoom:1.05,alpha:1-lt/0.35})}
    pr.firstChild.style.width=(t/total*100)+'%';requestAnimationFrame(step)}step()});
  mr.stop();await new Promise(r=>mr.onstop=r);const ext=mt.includes('mp4')?'mp4':'webm';save(new Blob(ch,{type:mt}),`${cur.id}_editado.${ext}`);
  rec=false;btn.disabled=false;btn.textContent='Baixar vídeo animado';pr.style.display='none';pr.firstChild.style.width='0';render()}
(async function(){await fontsReady();DATA.forEach(g=>g.items.forEach(p=>p.frames.forEach(f=>{measure(f);f._bl=blocksOf(f)})));
  const nav=document.getElementById('nav');let h='';DATA.forEach(g=>{h+=`<h3>${g.name}</h3>`;g.items.forEach(p=>{h+=`<button data-id="${p.id}"><img src="${p.frames[0].bg}" alt="">${p.title}${p.anim?'<span class="tg">animado</span>':''}</button>`})});nav.innerHTML=h;
  const all=DATA.flatMap(g=>g.items);nav.querySelectorAll('button').forEach(b=>b.onclick=()=>select(all.find(p=>p.id===b.dataset.id)));
  select(all.find(p=>p.id===location.hash.slice(1))||all[0])})();
</script></body></html>
